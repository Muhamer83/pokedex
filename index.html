<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
    />
    <title>Pokedex</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="standard.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dialog.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-content">
        <div class="brand">
          <h1>Pokedex</h1>
        </div>
        <div class="search-area">
          <input
            type="text"
            id="searchInput"
            data-id="search-input"
            placeholder="Min. 3 letters..."
            oninput="searchPokemon()"
          />
          <button
            data-id="search-button"
            onclick="searchPokemon()"
            aria-label="Search Pokemon"
          >
            Search
          </button>
        </div>
      </div>
    </header>

    <main data-id="content">
      <ul id="pokemon-list" class="grid"></ul>

      <div class="load-area">
        <button
          id="loadBtn"
          data-id="load-more-button"
          onclick="loadPokemon()"
          aria-label="Load more Pokemon"
        >
          Load More
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Pokedex Project. Created for educational purposes.</p>
      <p>
        Data provided by
        <a href="https://pokeapi.co/" target="_blank">PokeAPI</a>.
      </p>
    </footer>

    <div id="loading-screen" class="loading-screen" style="display: none">
      <p>Loading...</p>
    </div>

    <dialog
      id="pokedex-dialog"
      data-id="dialog"
      class="dialog"
      aria-label="Pokemon Details"
    >
      <div class="dialog-inner">
        <button
          id="closeBtn"
          data-id="close-dialog-button"
          onclick="closeDialog()"
          aria-label="Close dialog"
        >
          ✕
        </button>

        <div class="nav-buttons">
          <button
            data-id="prev-button"
            onclick="prevPokemon()"
            aria-label="Previous Pokemon"
          >
            ◀
          </button>
          <button
            data-id="next-button"
            onclick="nextPokemon()"
            aria-label="Next Pokemon"
          >
            ▶
          </button>
        </div>

        <div id="dialog-content"></div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
